# Netlify build for the SPA. For a live Supabase build, set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in Site settings → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

# Any deep link (/app/books, /books/BK-0103) must return the shell, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
